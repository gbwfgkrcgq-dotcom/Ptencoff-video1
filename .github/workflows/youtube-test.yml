name: YouTube upload test
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID of the video currently shown on GitHub Pages'
        required: true
        type: number
      visibility:
        description: 'Choose who can watch the uploaded video'
        type: choice
        default: private
        options: [private, public]
      title:
        description: 'Optional YouTube title'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: youtube-upload-test
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Upload from GitHub Pages to Filkina_Gramata
        env:
          VISIBILITY: ${{ inputs.visibility }}
          TITLE: ${{ inputs.title }}
          POST_ID: ${{ inputs.post_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 youtube_test.py "$POST_ID" --visibility "$VISIBILITY" --title "$TITLE"
