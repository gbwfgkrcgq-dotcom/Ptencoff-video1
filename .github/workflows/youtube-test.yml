name: Private YouTube upload test
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID of the latest @ptencoff video approved for this private test'
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: youtube-private-test
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test private upload to Filkina_Gramata
        env:
          POST_ID: ${{ inputs.post_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 youtube_test.py "$POST_ID"
