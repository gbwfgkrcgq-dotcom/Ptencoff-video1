name: Publish video to Telegram
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish sends the latest video; recovery options require checking the channel first'
        type: choice
        default: publish
        options: [publish, preview_caption, confirm_sent, clear_pending]
      post_id:
        description: 'Optional exact source video ID for this manual publication'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: telegram-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Configure publication state author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check and publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'publish' }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          if [[ -n "$POST_ID" ]]; then
            python3 publish.py "$MODE" --post-id "$POST_ID"
          else
            python3 publish.py "$MODE"
          fi
