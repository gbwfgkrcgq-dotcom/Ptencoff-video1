<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Видео</title>
<style>
  :root {
    color-scheme: dark;
    font-family: system-ui, sans-serif;
    color: #f3f3f3;
    background: #111;
  }
  body { margin: 0; }
  main {
    box-sizing: border-box;
    display: grid;
    align-content: center;
    justify-items: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: clamp(12px, 4vw, 42px);
  }
  video {
    display: block;
    width: 100%;
    max-width: 940px;
    max-height: calc(100vh - 2 * clamp(12px, 4vw, 42px));
    max-height: calc(100svh - 2 * clamp(12px, 4vw, 42px));
    border-radius: 12px;
    background: #000;
  }
  p { margin: 12px 0 0; text-align: center; }
</style>
</head>
<body>
<main>
  <video controls playsinline preload="metadata" aria-label="Видео" data-source="$source" data-post-id="$post_id" src="$media_url"></video>
  <p id="error" role="status" hidden>Видео сейчас недоступно. Попробуй обновить страницу позже.</p>
</main>
<script>
  const player = document.querySelector('video');
  const notice = document.getElementById('error');
  const showError = () => { notice.hidden = false; };
  player.addEventListener('error', showError);
  if (player.error) showError();
</script>
</body>
</html>
